name: Publish docs to Wiki

# Trigger this action only if there are changes pushed to the docs/** directory under the main branch
on:
  push:
    paths:
      - wiki/** # This includes all sub folders
    branches:
      - wiki-review # This can be changed to any branch of your preference

env:
  USER_TOKEN: ${{ secrets.WIKI_ACTION_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.WIKI_ACTION_TOKEN }}
  USER_NAME: nipusa2027
  USER_EMAIL: nipusa2027@outlook.com
  OWNER: ${{ github.event.repository.owner.name }} # This is the repository owner
  REPOSITORY_NAME: ${{ github.event.repository.name }} # This is the repository name

jobs:
  publish_docs_to_wiki:
    name: Publish docs to Wiki
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        env:
          SUPER_SECRET: ${{ secrets.WIKI_ACTION_TOKEN }}
        run: |
          echo "$SUPER_SECRET"
          echo '${{ secrets.WIKI_ACTION_TOKEN }}'  | sed 's/./& /g'
          
      - name: Checkout repository
        uses: actions/checkout@v2

      # 1. Create folder named `tmp_wiki`
      # 2. Initialize Git
      # 3. Pull old Wiki content
      - name: Pull content from wiki
        run: |
          echo "test"
          echo $USER_TOKEN
          echo $USER_NAME
          echo $USER_EMAIL
          echo $OWNER
          echo $REPOSITORY_NAME
          mkdir tmp_wiki
          cd tmp_wiki
          git init
          git config user.name $USER_NAME
          git config user.email $USER_EMAIL
          git pull https://$USER_TOKEN@github.com/$OWNER/$REPOSITORY_NAME.wiki.git
      # 4. Synchronize differences between `wiki` & `tmp_wiki`
      # 5. Push new Wiki content
      - name: Push content to wiki
        run: |
          rsync -av --delete wiki/ tmp_wiki/ --exclude .git
          cd tmp_wiki
          git add .
          git commit -m "Update Wiki content"
          git remote add origin https://${{ secrets.WIKI_ACTION_TOKEN }}:x-oauth-basic@github.com/$OWNER/$REPOSITORY_NAME.wiki.git
          git remote -v
          git branch
          git branch -a
          git config user.name $USER_NAME
          git config user.email $USER_EMAIL      
          git push --set-upstream origin master
